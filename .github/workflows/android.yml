name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Build-Nummer setzen
        run: echo "window.APP_BUILD = ${{ github.run_number }};" > www/version.js
      - run: npx cap add android
      - name: App-Icon und Benachrichtigungs-Symbol
        run: |
          npx capacitor-assets generate --android --iconBackgroundColor '#0f766e' --iconBackgroundColorDark '#0f766e'
          cp -r android-res/* android/app/src/main/res/
      # Auto-Backup in Dokumente/Stempeluhr: auf Android 10 und älter braucht das Speicher-Rechte
      - name: Speicher-Berechtigung für Backups (Android ≤ 10)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n\n    <application android:requestLegacyExternalStorage="true"#' $M
          grep -n 'EXTERNAL_STORAGE\|requestLegacy' $M
      - run: npx cap sync android
      # Fester Signierschlüssel, damit Updates über die alte Version installiert werden können (Daten bleiben erhalten)
      - name: Signierschlüssel einrichten
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Secret KEYSTORE_B64 fehlt – ohne festen Schlüssel lassen sich Updates nicht installieren"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/stempeluhr.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/stempeluhr.keystore" >> "$GITHUB_ENV"
          # Schlüssel ausdrücklich in die Gradle-Konfiguration eintragen (der Standard-Debug-Schlüssel wird sonst neu erzeugt)
          sed -i '0,/^android {/s//android {\n    signingConfigs {\n        debug {\n            storeFile file(System.getenv("KEYSTORE_FILE"))\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }/' android/app/build.gradle
          grep -n -A7 'signingConfigs' android/app/build.gradle
      - name: Versionsnummer in die APK schreiben
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName "[^"]*"/versionName "1.${{ github.run_number }}"/' android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
      - run: ./gradlew assembleDebug
        working-directory: android
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk Stempeluhr.apk
      - name: Signatur prüfen (muss bei jedem Build gleich sein)
        run: |
          SIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $SIGNER verify --print-certs Stempeluhr.apk | tee cert.txt
          grep -q "SHA-256 digest: 1c64c9f0d8b387885c04e44c" cert.txt || { echo "::error::APK ist nicht mit dem festen Schlüssel signiert"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Stempeluhr-APK
          path: Stempeluhr.apk
      - name: Release veröffentlichen (die App prüft darauf auf Updates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          gh release create "build-$N" Stempeluhr.apk --latest --title "Stempeluhr Build $N" --notes "$(git log -1 --pretty=%s)"
          # alte Releases aufräumen, nur die letzten 3 behalten
          gh release list --limit 100 --json tagName -q '.[].tagName' | grep -v "^build-$N$" | tail -n +3 | while read t; do gh release delete "$t" --yes --cleanup-tag; done
